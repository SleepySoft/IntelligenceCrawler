<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGS Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { gray: { 850: '#1f2937', 900: '#111827', 950: '#0b0f19' } },
                    fontFamily: { mono: ['Menlo', 'Monaco', 'Consolas', 'monospace'] },
                    fontSize: { 'xxs': '0.65rem' }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        [x-cloak] { display: none !important; }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-950 text-gray-300 h-screen overflow-hidden flex flex-col font-sans" x-data="dashboard()">

    <header class="bg-gray-900 border-b border-gray-800 h-12 flex items-center px-4 justify-between shrink-0 z-20 shadow-md">
        <div class="flex items-center gap-4">
            <h1 class="font-bold text-lg tracking-wider text-emerald-500">
                CGS <span class="text-gray-500 font-normal text-xs align-middle">Monitor</span>
            </h1>

            <div class="flex items-center gap-2 border-l border-gray-700 pl-4 ml-2">
                <div class="flex flex-col">
                    <span class="text-[9px] text-gray-500 uppercase">Session Start</span>
                    <span class="text-xs font-mono text-gray-400" x-text="formatTime(globalStats.session_start_ts_ms)"></span>
                </div>
                <button @click="resetStats()" class="text-xs bg-gray-800 hover:bg-red-900/50 hover:text-red-300 text-gray-500 px-2 py-1 rounded border border-gray-700 transition">
                    🗑 Reset
                </button>
            </div>

            <div class="flex bg-gray-800 rounded p-0.5 border border-gray-700 ml-4">
                <button @click="controlSystem('RESUME')" class="px-3 py-0.5 text-xs rounded transition-colors" :class="controlState === 'NORMAL' ? 'bg-emerald-700 text-white' : 'text-gray-400'">Run</button>
                <button @click="controlSystem('PAUSE')" class="px-3 py-0.5 text-xs rounded transition-colors" :class="controlState === 'PAUSE' ? 'bg-yellow-600 text-white' : 'text-gray-400'">Pause</button>
            </div>
        </div>

        <div class="flex gap-4 text-xs items-center">
            <button @click="flowModalOpen = true; fetchFlowDetails()"
                    class="flex items-center gap-2 px-2 py-1 rounded border border-gray-700 bg-gray-800/60 hover:bg-gray-800 transition">
                <span class="text-[10px] font-bold tracking-wider text-gray-400">FLOW</span>
                <span class="font-mono text-[10px] px-1.5 py-0.5 rounded border border-emerald-900/40 bg-emerald-900/20 text-emerald-300">
                    RUN <span x-text="flowSnapshot.running || 0"></span>
                </span>
                <span class="font-mono text-[10px] px-1.5 py-0.5 rounded border border-blue-900/40 bg-blue-900/20 text-blue-300">
                    Q <span x-text="flowSnapshot.queued || 0"></span>
                </span>
            </button>

            <a href="/api/export/global" target="_blank" class="flex items-center gap-1 text-xs bg-gray-800 hover:text-blue-300 text-gray-400 px-3 py-1 rounded border border-gray-700">
                <span>⬇ Report</span>
            </a>

            <div class="flex items-center gap-2 border-l border-gray-700 pl-4">
                <span class="text-gray-500 uppercase text-[10px]">Total Results</span>
                <span class="font-mono font-bold text-gray-200" x-text="globalStats.results?.total || 0"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <aside class="w-[300px] border-r border-gray-800 flex flex-col bg-gray-900/50 flex-shrink-0 select-none">
            <div class="p-2 bg-gray-900 border-b border-gray-800 flex justify-between items-center h-[36px]">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 pl-2">Explorer</h2>
                <div class="flex gap-1">
                    <button @click="expandAll()" class="text-[10px] bg-gray-800 px-1.5 rounded text-gray-500">+</button>
                    <button @click="collapseAll()" class="text-[10px] bg-gray-800 px-1.5 rounded text-gray-500">-</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto py-2 custom-scrollbar">
                <template x-for="node in visibleTreeNodes" :key="node.path">
                    <div class="flex items-center justify-between cursor-pointer hover:bg-gray-800/80 min-h-[26px] pr-2 transition-colors relative"
                         :class="selectedGroup === node.path ? 'bg-gray-800 border-r-2 border-emerald-500' : ''"
                         @click="handleNodeClick(node)">

                        <div class="flex items-center flex-1 min-w-0" :style="`padding-left: ${node.level * 12 + 8}px`">
                            <div class="w-4 h-4 flex items-center justify-center mr-1 text-gray-500 hover:text-white shrink-0"
                                 @click.stop="toggleNode(node.path)">
                                <span x-show="node.hasChildren" x-text="isCollapsed(node.path) ? '▶' : '▼'" class="text-[8px]"></span>
                                <span x-show="!node.hasChildren" class="text-[8px] opacity-20">•</span>
                            </div>
                            <div class="mr-2 shrink-0" x-show="node.isRealGroup">
                                <div class="w-2 h-2 rounded-full"
                                     :class="getNodeHealthColor(node.data)"></div>
                            </div>
                            <span class="text-xs truncate" x-text="node.name" :class="node.isRealGroup ? 'text-gray-200' : 'text-gray-500'"></span>
                        </div>

                        <template x-if="node.isRealGroup && node.data">
                            <div class="text-[9px] font-mono text-gray-500 flex gap-1">
                                <span x-show="node.data.round?.round_id > 0" class="text-blue-400">R<span x-text="node.data.round.round_id"></span></span>
                                <span x-show="node.data.stats?.results?.total > 0" x-text="node.data.stats.results.total"></span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </aside>

        <section class="flex-1 flex flex-col bg-gray-950 min-w-0">

            <div class="bg-gray-900 border-b border-gray-700 shadow-md shrink-0" x-show="currentGroupData" x-transition>
                <div class="px-4 py-2 flex justify-between items-center border-b border-gray-800 bg-gray-850">
                    <div class="flex items-center gap-2">
                        <span class="text-gray-500 text-xs font-mono" x-text="currentGroupData?.group_path"></span>
                        <div class="h-4 border-l border-gray-700 mx-2"></div>
                        <a :href="`/api/export/group_logs?group=${encodeURIComponent(currentGroupData?.group_path || '')}`" target="_blank" class="text-[10px] text-blue-400 hover:underline">Export Logs</a>
                    </div>
                    <button @click="closeGroup()" class="text-xs text-gray-500 hover:text-white">✕ Close</button>
                </div>

                <div class="p-4 flex gap-4 overflow-x-auto">
                    <div class="flex-1 bg-gray-800/50 border border-gray-700 rounded p-3 min-w-[300px]">
                        <div class="flex justify-between mb-2">
                            <span class="text-[10px] font-bold text-gray-500 uppercase">Anchor / List</span>
                            <span class="text-[10px] font-mono"
                                  :class="currentGroupData?.anchor?.http_code >= 400 ? 'text-red-400' : 'text-emerald-400'"
                                  x-text="currentGroupData?.anchor?.http_code ? 'HTTP ' + currentGroupData.anchor.http_code : 'NO STATUS'"></span>
                        </div>
                        <div class="text-xs text-gray-300 truncate font-mono mb-1" x-text="currentGroupData?.list_url || 'No URL'"></div>
                        <div class="text-[10px] text-gray-500 truncate" x-text="currentGroupData?.anchor?.state_msg || 'System Normal'"></div>
                    </div>

                    <div class="flex-1 bg-gray-800/50 border border-gray-700 rounded p-3 min-w-[200px]" x-show="currentRound">
                        <div class="flex justify-between mb-2">
                            <span class="text-[10px] font-bold text-gray-500 uppercase">Round #<span x-text="currentRound?.round_id"></span></span>
                            <span class="text-[10px] font-mono text-blue-400" x-text="currentRound?.phase"></span>
                        </div>
                        <div class="w-full h-1.5 bg-gray-700 rounded-full overflow-hidden mt-1 mb-1">
                            <div class="h-full bg-blue-500 transition-all duration-500" :style="`width: ${currentRound?.progress_pct}%`"></div>
                        </div>
                        <div class="flex justify-between text-[9px] text-gray-400 font-mono">
                            <span>OK: <span class="text-emerald-400" x-text="currentRound?.stats?.success"></span></span>
                            <span>Err: <span class="text-red-400" x-text="currentRound?.stats?.failed"></span></span>
                            <span><span x-text="currentRound?.processed"></span>/<span x-text="currentRound?.expected"></span></span>
                        </div>
                    </div>

                    <div class="w-32 bg-gray-800/50 border border-gray-700 rounded p-3 shrink-0">
                        <div class="text-[10px] font-bold text-gray-500 uppercase mb-1">Perf</div>
                        <div class="text-xs text-gray-300">Avg: <span class="font-mono text-blue-300" x-text="currentGroupData?.stats?.perf?.avg"></span>s</div>
                        <div class="text-xs text-gray-300">Run: <span class="font-mono text-yellow-300" x-text="currentGroupData?.stats?.results?.running"></span></div>
                    </div>
                </div>
            </div>

            <div class="px-4 py-2 bg-gray-900 border-b border-gray-800 flex justify-between items-center shrink-0">
                <div class="flex bg-gray-950 p-1 rounded border border-gray-700 gap-1">
                    <button @click="viewMode = 'LIVE'" :class="viewMode === 'LIVE' ? 'bg-gray-800 text-emerald-400 shadow-sm' : 'text-gray-500'" class="px-3 py-1 text-xs rounded transition-all font-bold">Live</button>
                    <button @click="viewMode = 'HISTORY'" :class="viewMode === 'HISTORY' ? 'bg-gray-800 text-blue-400 shadow-sm' : 'text-gray-500'" class="px-3 py-1 text-xs rounded transition-all font-bold">History</button>
                    <button @click="viewMode = 'CHART'" :class="viewMode === 'CHART' ? 'bg-gray-800 text-purple-400 shadow-sm' : 'text-gray-500'" class="px-3 py-1 text-xs rounded transition-all font-bold">Chart</button>
                </div>

                <div class="flex gap-2" x-show="viewMode === 'HISTORY'" x-cloak>
                    <input type="datetime-local" x-model="filters.start" class="bg-gray-950 border border-gray-700 text-xs rounded px-2 h-6 text-gray-300">
                    <input type="datetime-local" x-model="filters.end" class="bg-gray-950 border border-gray-700 text-xs rounded px-2 h-6 text-gray-300">
                    <button @click="fetchLogs()" class="text-xs bg-blue-900/30 text-blue-300 border border-blue-800 px-2 rounded hover:bg-blue-900/50">Query</button>
                </div>
            </div>

            <div class="flex-1 flex flex-col min-h-0 bg-gray-950 relative">

                <div x-show="viewMode !== 'CHART'" class="flex flex-col h-full">
                    <div class="grid grid-cols-12 gap-2 px-4 py-2 bg-gray-900/50 border-b border-gray-800 text-xxs font-bold text-gray-500 uppercase shrink-0">
                        <div class="col-span-1 text-center">ID</div>
                        <div class="col-span-2">Time</div>
                        <div class="col-span-1">Status</div>
                        <div class="col-span-6">URL</div>
                        <div class="col-span-1">Code</div>
                        <div class="col-span-1 text-right">Dur(s)</div>
                    </div>
                    <div class="flex-1 overflow-y-auto">
                        <template x-for="row in logs" :key="row.id || row.url">
                            <div class="grid grid-cols-12 gap-2 px-4 py-1.5 border-b border-gray-800/30 text-xs font-mono items-center hover:bg-gray-800/40">
                                <div class="col-span-1 text-center text-gray-600 text-[10px]" x-text="row.id || '-'"></div>
                                <div class="col-span-2 text-gray-500 text-[10px]" x-text="formatTime(row.updated_ts_ms || row.start_ts_ms)"></div>
                                <div class="col-span-1">
                                    <span class="px-1.5 py-0.5 rounded-[2px] text-[10px] font-bold border inline-block w-12 text-center"
                                          :class="getStatusClass(row.status)" x-text="getStatusLabel(row.status)"></span>
                                </div>
                                <div class="col-span-6 truncate text-gray-400 hover:text-white cursor-pointer" :title="row.url">
                                    <a :href="row.url" target="_blank" x-text="row.url"></a>
                                </div>
                                <div class="col-span-1" :class="row.http_code >= 400 ? 'text-red-400' : 'text-emerald-500'" x-text="row.http_code || '-'"></div>
                                <div class="col-span-1 text-right text-gray-500" x-text="row.duration_s || '-'"></div>
                            </div>
                        </template>
                        <div x-show="logs.length === 0" class="p-8 text-center text-gray-600 text-xs italic">No records found.</div>
                    </div>
                </div>

                <div x-show="viewMode === 'CHART'" class="flex flex-col h-full p-4" x-cloak>
                    <div class="flex justify-between items-center mb-4 shrink-0">
                        <div class="flex gap-2">
                            <select x-model="chartRange" @change="fetchChart()" class="bg-gray-900 border border-gray-700 text-xs text-gray-300 rounded px-2 py-1 outline-none focus:border-emerald-500">
                                <option value="1">Last 1 Hour</option>
                                <option value="6">Last 6 Hours</option>
                                <option value="24">Last 24 Hours</option>
                            </select>
                            <button @click="fetchChart()" class="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-3 py-1 rounded transition">Refresh</button>
                        </div>
                        <div class="text-xs text-gray-500 font-mono">
                            Max: <span x-text="chartMax"></span> reqs
                        </div>
                    </div>

                    <div class="flex-1 relative border-l border-b border-gray-700/50 bg-gray-900/20 min-h-0">

                        <div class="absolute inset-0 flex flex-col justify-between pointer-events-none z-0">
                            <div class="border-t border-gray-800/50 w-full h-0 relative">
                                <span class="absolute -left-8 -top-2 text-[9px] text-gray-500 w-6 text-right" x-text="formatYAxis(chartMax)"></span>
                            </div>
                            <div class="border-t border-gray-800/30 w-full h-0 relative">
                                 <span class="absolute -left-8 -top-2 text-[9px] text-gray-500 w-6 text-right" x-text="formatYAxis(chartMax/2)"></span>
                            </div>
                            <div class="relative">
                                 <span class="absolute -left-8 -top-2 text-[9px] text-gray-500 w-6 text-right">0</span>
                            </div>
                        </div>

                        <div class="absolute inset-0 flex items-end overflow-x-auto overflow-y-hidden custom-scrollbar pl-1 pt-4 z-10">
                            <template x-for="(bar, index) in chartData" :key="bar.bucket_ts_ms">
                                <div class="h-full flex flex-col justify-end group relative shrink-0"
                                     :style="`width: ${getBarWidth()}`">

                                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 hidden group-hover:block z-50">
                                        <div class="bg-gray-800 border border-gray-600 text-[10px] p-2 rounded shadow-xl whitespace-nowrap">
                                            <div class="text-gray-400 mb-1" x-text="formatTime(bar.bucket_ts_ms)"></div>
                                            <div class="flex gap-3 font-mono">
                                                <span class="text-emerald-400">OK: <span x-text="bar.success"></span></span>
                                                <span class="text-red-400">Err: <span x-text="bar.fail"></span></span>
                                            </div>
                                            <div class="text-gray-500 mt-0.5 pt-0.5 border-t border-gray-700">Total: <span x-text="bar.total"></span></div>
                                        </div>
                                    </div>

                                    <div class="w-[80%] mx-auto rounded-t transition-all relative group-hover:brightness-125"
                                         :class="bar.total > 0 ? 'bg-emerald-600/80' : 'bg-transparent'"
                                         :style="`height: ${bar.total > 0 ? Math.max(1, (bar.total / chartMax) * 100) : 0}%`">

                                        <div class="absolute bottom-0 w-full bg-red-500/90 rounded-b"
                                             x-show="bar.fail > 0"
                                             :style="`height: ${(bar.fail / bar.total) * 100}%`">
                                        </div>
                                    </div>

                                    <div class="absolute top-full left-1/2 -translate-x-1/2 mt-1 text-[9px] text-gray-600 font-mono whitespace-nowrap"
                                         x-show="shouldShowLabel(index, chartData.length)"
                                         x-text="formatTimeShort(bar.bucket_ts_ms)">
                                    </div>

                                    <div class="absolute top-0 bottom-0 left-1/2 w-px bg-white/5 opacity-0 group-hover:opacity-100 pointer-events-none"></div>
                                </div>
                            </template>

                            <div x-show="chartData.length === 0" class="w-full h-full flex items-center justify-center text-gray-600 text-xs">
                                No data in range
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <div x-show="flowModalOpen" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm" @click.self="flowModalOpen = false">
        <div class="bg-gray-900 w-[600px] max-h-[80vh] rounded border border-gray-700 flex flex-col shadow-xl overflow-hidden">
            <div class="h-10 bg-gray-800 flex justify-between items-center px-4 border-b border-gray-700">
                <span class="text-xs font-bold">Flow Scheduler Snapshot</span>
                <button @click="flowModalOpen=false" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <div class="p-4 overflow-y-auto text-xs font-mono space-y-4">
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-gray-800 p-2 rounded"><div class="text-emerald-400 text-lg" x-text="flowSnapshot.stats?.running"></div><div class="text-gray-500">Running</div></div>
                    <div class="bg-gray-800 p-2 rounded"><div class="text-blue-400 text-lg" x-text="flowSnapshot.stats?.queued"></div><div class="text-gray-500">Queued</div></div>
                    <div class="bg-gray-800 p-2 rounded"><div class="text-gray-400 text-lg" x-text="flowSnapshot.stats?.sleeping"></div><div class="text-gray-500">Sleeping</div></div>
                </div>
                <div>
                    <h4 class="text-gray-500 mb-1 border-b border-gray-800">Running Keys</h4>
                    <template x-for="item in flowSnapshot.details?.running" :key="item.key">
                        <div class="flex justify-between py-0.5 text-emerald-300">
                            <span x-text="item.key"></span><span x-text="item.duration + 's'"></span>
                        </div>
                    </template>
                </div>
                 <div>
                    <h4 class="text-gray-500 mb-1 border-b border-gray-800">Queued</h4>
                    <template x-for="item in flowSnapshot.details?.queued" :key="item.key">
                        <div class="flex justify-between py-0.5 text-blue-300">
                            <span x-text="item.key"></span><span x-text="'Wait: ' + item.wait + 's'"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        function dashboard() {
            return {
                // Data State
                globalStats: {},
                groups: [],
                logs: [],
                flowSnapshot: { stats: {}, details: {} },

                // UI State
                viewMode: 'LIVE', // LIVE, HISTORY, CHART
                selectedGroup: null,
                currentGroupData: null,
                currentRound: null,

                // Tree
                treeNodes: [],
                collapsedPaths: new Set(),

                // Filters & Inputs
                filters: { start: '', end: '' },
                chartRange: '6', // hours
                chartData: [],
                chartMax: 1,

                // System Control
                controlState: 'NORMAL',
                flowModalOpen: false,

                init() {
                    this.poll();
                    setInterval(() => this.poll(), 2000);
                },

                async poll() {
                    try {
                        // 1. Fetch Global Stats (Engine.live_summary)
                        const res = await fetch('/api/dashboard/stats');
                        const data = await res.json();

                        // Engine returns { meta:..., global:..., groups:... }
                        if (data.global) this.globalStats = data.global;
                        if (data.groups) {
                            this.groups = data.groups;
                            this.rebuildTree();
                        }

                        // 2. Fetch Logs if in LIVE mode
                        if (this.viewMode === 'LIVE') {
                            await this.fetchLogs();
                        }

                        // 3. Update current group selection object from fresh data
                        if (this.selectedGroup) {
                            this.currentGroupData = this.groups.find(g => g.group_path === this.selectedGroup);
                            this.currentRound = this.currentGroupData?.round;
                        }

                    } catch (e) { console.error("Poll error", e); }
                },

                async fetchLogs() {
                    let url = '/api/logs?limit=100';

                    if (this.selectedGroup) {
                        url += `&group_path=${encodeURIComponent(this.selectedGroup)}`;
                    }

                    if (this.viewMode === 'HISTORY') {
                        if (this.filters.start && this.filters.end) {
                            const s = new Date(this.filters.start).getTime() / 1000;
                            const e = new Date(this.filters.end).getTime() / 1000;
                            url += `&start_ts=${s}&end_ts=${e}`;
                        }
                    } else {
                        // LIVE mode: fetch recent logs or status based on preference
                        // using logs endpoint for stream view
                        // url stays default
                    }

                    const res = await fetch(url);
                    const json = await res.json();
                    // Engine returns { meta:..., items:[...] }
                    this.logs = json.items || [];
                },

                async fetchChart() {
                    if (!this.selectedGroup) return; // Simple safety

                    const end = Date.now() / 1000;
                    const start = end - (parseInt(this.chartRange) * 3600);
                    // Use a reasonable bucket size
                    const bucket = parseInt(this.chartRange) <= 1 ? 1 : (parseInt(this.chartRange) <= 6 ? 5 : 60);

                    const params = new URLSearchParams({
                        start_ts: start,
                        end_ts: end,
                        bucket_minutes: bucket,
                        group_filter: this.selectedGroup
                    });

                    const res = await fetch(`/api/dashboard/chart?${params}`);
                    const json = await res.json();
                    this.chartData = json.items || [];
                    this.chartMax = Math.max(1, ...this.chartData.map(b => b.total));
                },

                // 格式化 Y 轴数值 (如 1000 -> 1k)
                formatYAxis(num) {
                    if (!num) return 0;
                    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
                    return Math.round(num);
                },

                // 格式化 X 轴短时间 (14:30)
                formatTimeShort(ms) {
                    if (!ms) return '';
                    const d = new Date(ms);
                    return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                },

                // 智能计算柱子宽度
                getBarWidth() {
                    const len = this.chartData.length;
                    if (len <= 24) return '4%';     // 数据少时，柱子宽一点
                    if (len <= 60) return '1.6%';   // 中等密度
                    return '6px';                   // 数据多时，固定像素宽度
                },

                // 智能决定是否显示标签 (防止挤在一起)
                shouldShowLabel(index, total) {
                    if (total <= 12) return true; // 数据少，全显示

                    // 动态计算步长，保证大概显示 6-8 个标签
                    const step = Math.ceil(total / 8);
                    return index % step === 0;
                },

                async fetchFlowDetails() {
                    const res = await fetch('/api/flow/snapshot?limit=50');
                    this.flowSnapshot = await res.json();
                },

                async controlSystem(action) {
                    await fetch(`/api/control/${action}`, {method: 'POST'});
                    if(action !== 'IMMEDIATE') this.controlState = (action === 'RESUME' ? 'NORMAL' : 'PAUSE');
                },

                async resetStats() {
                    if(confirm("Reset Memory Stats?")) await fetch('/api/control/reset_stats', {method: 'POST'});
                },

                // --- Tree Logic (Simplified) ---
                rebuildTree() {
                    const map = new Map();
                    this.groups.forEach(g => {
                        const parts = g.group_path.split('/');
                        let path = '';
                        parts.forEach((p, i) => {
                            path = path ? `${path}/${p}` : p;
                            if (!map.has(path)) {
                                map.set(path, { path, name: p, level: i, isRealGroup: false, hasChildren: false });
                            }
                            if (i === parts.length - 1) {
                                const node = map.get(path);
                                node.isRealGroup = true;
                                node.data = g; // Attach live group data
                            }
                            if (i > 0) {
                                const parent = path.substring(0, path.lastIndexOf('/'));
                                if (map.has(parent)) map.get(parent).hasChildren = true;
                            }
                        });
                    });
                    this.treeNodes = Array.from(map.values()).sort((a,b) => a.path.localeCompare(b.path));
                },

                get visibleTreeNodes() {
                    return this.treeNodes.filter(n => {
                        const parts = n.path.split('/');
                        let check = '';
                        for(let i=0; i<parts.length-1; i++) {
                            check = check ? `${check}/${parts[i]}` : parts[i];
                            if(this.collapsedPaths.has(check)) return false;
                        }
                        return true;
                    });
                },

                handleNodeClick(node) {
                    if (node.isRealGroup) {
                        this.selectedGroup = node.path;
                        this.logs = []; // Clear old logs visually
                        this.fetchLogs();
                        if (this.viewMode === 'CHART') this.fetchChart();
                    } else {
                        this.toggleNode(node.path);
                    }
                },

                toggleNode(p) { this.collapsedPaths.has(p) ? this.collapsedPaths.delete(p) : this.collapsedPaths.add(p); },
                isCollapsed(p) { return this.collapsedPaths.has(p); },
                expandAll() { this.collapsedPaths.clear(); },
                collapseAll() { this.treeNodes.forEach(n => n.hasChildren && this.collapsedPaths.add(n.path)); },
                closeGroup() { this.selectedGroup = null; this.currentGroupData = null; },

                // --- Helpers ---
                formatTime(ms) {
                    if (!ms) return '-';
                    const d = new Date(ms);
                    return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
                },

                getNodeHealthColor(g) {
                    const s = g?.anchor?.status;
                    if (s === 1) return 'bg-blue-500 animate-pulse'; // Running
                    if (s === 2) return 'bg-emerald-500'; // Success
                    if (s === 3 || s === 4) return 'bg-red-500'; // Fail
                    return 'bg-gray-600'; // Pending/Other
                },

                getStatusLabel(s) {
                    return {0:'PEND',1:'RUN',2:'OK',3:'TMP',4:'PRM',5:'SKIP',6:'STOP',7:'CACHED',8:'IGN'}[s] || s;
                },

                getStatusClass(s) {
                    if (s === 1) return 'bg-blue-900/40 text-blue-300 border-blue-800';
                    if (s === 2 || s === 7) return 'bg-emerald-900/40 text-emerald-300 border-emerald-800';
                    if (s === 3) return 'bg-yellow-900/40 text-yellow-300 border-yellow-800';
                    if (s === 4) return 'bg-red-900/40 text-red-300 border-red-800';
                    return 'bg-gray-800 text-gray-500 border-gray-700';
                }
            }
        }
    </script>
</body>
